services:
  # 1. EquiShare Backend Web Service (Node.js Express API)
  - type: web
    name: equishare-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"

  # 2. EquiShare Frontend Static Site (Optional: if hosting frontend on Render as well)
  - type: web
    name: equishare-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: equishare-backend
          property: host
          value: https://equishare-backend.onrender.com/api
